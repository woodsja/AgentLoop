name: CI

# Authoritative pass/fail check for pull requests into main and ralph-dev. Ralph's
# autopilot waits on the Actions runs for the delivered head commit.
on:
  pull_request:
    branches: [main, ralph-dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Test
        run: npm test
